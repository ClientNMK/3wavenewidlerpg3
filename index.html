.fighters::after{top:70%;background:radial-gradient(ellipse 8px 2px at 26px 30%,#a99caa88 15%,transparent 92%),linear-gradient(110deg,transparent 0 83%,#201f39ad 84% 86%,transparent 87%);background-size:97px 100%,97px 100%;animation:foreground-scroll .42s linear infinite paused}
.fighters[data-phase="approach"]::after{animation:foreground-scroll .42s linear infinite}
@keyframes foreground-scroll{to{background-position:-97px 0,-97px 0}}
.fighter.party,.fighter.foe{position:absolute;bottom:4px;top:0}
.fighter.party{left:0;width:40%}.fighter.foe{right:1%;width:42%}
.party .actor,.party .witch,.foe .actor{position:absolute;bottom:25%;width:38%;margin:0;height:var(--party-art-height)}
.party #heroActor{left:41%}.party .witch{left:11%;scale:.93}
.foe .actor{left:31%;height:var(--monster-art-height)}
.actor img,.foe .actor img{inset:auto auto 0 50%;width:auto;height:100%;margin:0;transform:translateX(-50%);scale:none}
.foe[data-boss="true"]{--monster-scale:1.14}
.party .actor::before,.foe .actor::before{left:20%;width:60%;height:8px;bottom:0}
.warrior-health,.monster-health{position:absolute;top:76%;width:max-content;max-width:100%;text-align:center;transform:translateX(-50%);margin:0}
.warrior-health{left:60%}.monster-health{left:50%}
.warrior-health .hp{width:calc(var(--party-art-height) * 421 / 440);height:5px;margin:2px auto}
.monster-health .hp{width:calc(var(--monster-art-height) * 440 / 404 * var(--monster-scale,1));height:5px;margin:2px auto}
.warrior-health strong,.monster-health strong{font-size:11px;line-height:13px}
.warrior-health small,.monster-health small{font-size:10px;line-height:11px;white-space:nowrap}
.fighter .impact{top:46%;z-index:2}.fighter.party .impact{left:60%}
@media(prefers-reduced-motion:reduce){.fighters[data-phase="approach"]::before,.fighters[data-phase="approach"]::after{animation:none}}

.foe .impact{left:50%;font-size:clamp(12px,3.5vw,18px);font-weight:900;white-space:nowrap;transform:translateX(-50%);background:#171324d9;border-radius:5px;padding:1px 5px;line-height:1.12}
.foe .damage-warrior{top:27%;color:#ffb29f}
.foe .damage-witch{top:42%;color:#ffe393}


.reels [data-rarity="0"],.reels[data-rarity="0"],.rarity-badge[data-rarity="0"],.rarity-card[data-rarity="0"]{--prize:#e1e7ef;--prize-deep:#737e96}
.reels [data-rarity="1"],.reels[data-rarity="1"],.rarity-badge[data-rarity="1"],.rarity-card[data-rarity="1"]{--prize:#8dd9ff;--prize-deep:#3766ba}
.reels [data-rarity="2"],.reels[data-rarity="2"],.rarity-badge[data-rarity="2"],.rarity-card[data-rarity="2"]{--prize:#e7b0ff;--prize-deep:#8451ac}
.reels [data-rarity="3"],.reels[data-rarity="3"],.rarity-badge[data-rarity="3"],.rarity-card[data-rarity="3"]{--prize:#ffde83;--prize-deep:#9e512f}
.reels [data-rarity="4"],.reels[data-rarity="4"],.rarity-badge[data-rarity="4"],.rarity-card[data-rarity="4"]{--prize:#ffa0ab;--prize-deep:#9e305f}
.reels span.win,.reels.jackpot span.win{color:#1c1724;background:linear-gradient(115deg,var(--prize-deep),var(--prize),var(--prize-deep));border-color:var(--prize);box-shadow:inset 0 0 9px var(--prize)}
.reels span.win small,.reels.jackpot span.win small{color:#1c1724}
.reels.jackpot span.win{animation:rarity-flash 480ms ease-out}
.reels.jackpot::after{color:var(--prize);border-color:var(--prize);box-shadow:0 0 20px var(--prize)}
@keyframes rarity-flash{28%{scale:1.08;box-shadow:0 0 18px var(--prize);filter:brightness(1.2)}}


.training{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 9px;background:#222435;border-top:1px solid #49405b;color:#eddbb3;font-size:13px}
#challenge{min-height:44px;padding:5px 13px;color:#2c1a15;background:linear-gradient(#ffdfa0,#dda157);font-weight:bold}

.rarity-badge{display:inline-block;width:max-content;margin-top:3px;padding:1px 6px;border:1px solid var(--prize);border-radius:5px;background:#171521;color:var(--prize);font-size:12px;font-weight:800;line-height:1.35}
.gear .rarity-card[data-rarity],.compare-grid .rarity-card[data-rarity]{
  background:linear-gradient(145deg,color-mix(in srgb,var(--prize-deep) 64%,#13121d),color-mix(in srgb,var(--prize-deep) 40%,#12101a));
  border:1px solid color-mix(in srgb,var(--prize) 72%,#453c50);
  border-left:3px solid var(--prize);
}
.rarity-card[data-rarity] strong{color:#fff4e5}
.rarity-card[data-rarity] small{color:#ece2da}
.compare-grid .rarity-card.better{outline:2px solid #9de4b9;outline-offset:2px}

.spin-controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}
#autoSpin{min-height:44px;font-size:13px;border-color:#8c759e;background:#262034}
#autoSpin[aria-pressed="true"]{color:#efe3ff;background:#554076;border-color:#bd9ae6}
#autoStatus{display:block;margin-top:4px;font-size:12px}
</style>
</head>
<body>
<main>
<header><div><h1>검과 마녀 · 세계의 탑</h1></div><div class="wallet"><span id="chips">0</span> 칩<br><small><span id="essence">0</span> 마력정수</small></div></header>
<div class="grid">
<section class="panel arena" aria-labelledby="combatTitle">
<div class="row"><h2 id="combatTitle">세계의 탑</h2><strong class="tag" id="stage"></strong></div>
<div class="fighters" id="fightScene">
<div class="fighter party">
<div class="actor witch" id="witchActor"><img src="assets/tower-witch-chibi.webp" alt=""></div>
<div class="actor" id="heroActor"><img src="assets/tower-warrior-chibi.webp" alt=""></div>
<span class="impact" id="heroActorImpact" aria-hidden="true"></span>
<div class="warrior-health" id="warriorHealth"><strong>전사</strong><div class="hp" aria-hidden="true"><span id="heroBar"></span></div><small id="heroHp"></small><small id="regenRate" style="display:block"></small></div>
</div>
<div class="fighter foe" id="foe"><div class="actor" id="enemyActor" aria-hidden="true"><img src="assets/tower-monster-chibi.webp" alt=""></div><span class="impact damage-warrior" id="warriorHit" aria-hidden="true"></span><span class="impact damage-witch" id="witchHit" aria-hidden="true"></span><div id="monsterHealth" class="monster-health"><strong id="enemy"></strong><div class="hp" aria-hidden="true"><span id="enemyBar"></span></div><small id="enemyHp"></small></div></div>
</div>
<div class="team-damage"><span id="warriorDps"></span><span id="witchDps"></span></div>
<p id="battleNote" class="muted">전사와 마녀가 탑을 오르는 중입니다.</p>
<div id="training" class="training" hidden><span id="trainingNote"></span><button id="challenge" type="button">도전</button></div>
</section>
<section class="panel" aria-labelledby="slotTitle">
<div class="row"><h2 id="slotTitle">보물 슬롯</h2><span id="forge"></span></div>
<div id="reels" class="reels" aria-label="슬롯 결과"><span>·</span><span>·</span><span>·</span><span>·</span><span>·</span><span>·</span><span>·</span><span>·</span><span>·</span></div>
<div class="spin-controls">
<button class="primary" id="spin" type="button">슬롯 돌리기</button>
<button id="autoSpin" type="button" aria-pressed="false">자동 돌리기</button>
</div>
<small id="autoStatus" class="muted" hidden></small>
<p id="spinNote" class="notice muted" role="status">가운데 가로줄에 2개면 일반. 같은 문양 1줄 희귀 · 2줄 상급 · 3줄 전설 · 4줄 이상 신화.</p>
<div class="upgrade-box">
<div class="row"><label for="essenceGauge">강화에 필요한 마력정수</label><strong id="essenceCount"></strong></div>
<progress id="essenceGauge" value="0" max="4"></progress>
<button id="upgrade" type="button" disabled>강화!</button>
</div>
</section>
<section class="panel" aria-labelledby="gearTitle">
<button id="reopen" type="button" hidden>획득한 장비 비교</button>
<details><summary id="gearTitle">장착 장비 · 전사 / 마녀</summary>
<div class="gear-groups"><div><h3>전사</h3><div class="gear" id="warriorGear"></div></div><div><h3>마녀</h3><div class="gear" id="witchGear"></div></div></div>
</details>
</section>
</div>
<div class="tools"><button id="restart" type="button">처음부터</button><button id="benchmark" type="button">100단계 시험</button><small id="mode"></small></div>
</main>
<dialog id="compare" aria-labelledby="compareTitle">
<h2 id="compareTitle">장비 비교</h2>
<p id="comparison" aria-live="polite"></p>
<div class="compare-grid">
<article id="oldCard" class="rarity-card"><small>현재 장비</small><strong id="oldName"></strong><span id="oldRarity" class="rarity-badge" hidden></span><p id="oldFormula"></p><small id="oldDetail"></small></article>
<article id="newCard" class="rarity-card"><small>새 장비</small><strong id="newName"></strong><span id="newRarity" class="rarity-badge" hidden></span><p id="newFormula"></p><small id="newDetail"></small></article>
</div>
<div class="dialog-actions"><button id="equip" type="button">장착</button><button id="salvage" type="button">분해</button><button id="dismiss" type="button" autofocus>나중에 결정</button></div>
</dialog>
<dialog id="restartDialog" aria-labelledby="restartTitle">
<h2 id="restartTitle">처음부터 시작할까요?</h2>
<p>칩, 장비, 스테이지 진행이 초기화됩니다.</p>
<div class="dialog-actions">
<button id="cancelRestart" value="cancel" type="button" autofocus>취소</button><button id="confirmRestart" value="restart" type="button">1단계부터 시작</button>
</div>
</dialog>
<script>
'use strict';
const parts = {
  '전사 무기': {owner:'warrior', icon:'⚔', stat:'weapon', names:['탑길잡이 대검','붉은 쌍검']},
  '전사 방패': {owner:'warrior', icon:'◈', stat:'hp', names:['성문 방패']},
  '전사 투구': {owner:'warrior', icon:'⛑', stat:'hp', names:['철빛 투구']},
  '전사 상의': {owner:'warrior', icon:'♜', stat:'hp', names:['붉은 망토 갑옷']},
  '전사 신발': {owner:'warrior', icon:'♟', stat:'attack', names:['탑지기 장화']},
  '마녀 무기': {owner:'witch', icon:'☄', stat:'weapon', names:['황금가지 지팡이','달빛 완드']},
  '마녀 모자': {owner:'witch', icon:'▲', stat:'regen', names:['별그늘 모자']},
  '마녀 망토': {owner:'witch', icon:'▥', stat:'regen', names:['밤결 망토']},
  '마녀 반지': {owner:'witch', icon:'◎', stat:'attack', names:['호박석 반지']},
  '마녀 부적': {owner:'witch', icon:'✦', stat:'attack', names:['작은 쥐의 부적']}
};
const party = {
  warrior:{name:'전사', weapon:'전사 무기', weight:8n, actor:'heroActor'},
  witch:{name:'마녀', weapon:'마녀 무기', weight:2n, actor:'witchActor'}
};
const symbols = Object.keys(parts);
const baseHp = 70n;
const baseDamage = 15n;
const combatStepMs = 100;
const paylines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const format = value => {
  const digits = String(value);
  return digits.length < 8 ? value.toLocaleString('ko-KR') : digits[0] + '.' + digits.slice(1, 3) + 'e' + (digits.length - 1);
};
function power(stage) {
  const tier = Math.floor((stage - 1) / 5);
  return (5n + BigInt((stage - 1) % 5)) * (2n ** BigInt(tier));
}
const monstersPerStage = 5;
const bossInterval = 10;
function enemyAt(stage, encounter = 1) {
  const boss = stage % bossInterval === 0 && encounter > monstersPerStage;
  const rush = boss && stage % (2 * bossInterval) === 0;
  const base = power(stage);
  const maxHp = base * (rush ? 15n : boss ? 22n : 9n) * 10n;
  return {boss, rush, maxHp, hp:maxHp, damage:base * (boss ? 3n : 2n) / 2n};
}
const rarityNames = ['일반','희귀','상급','전설','신화'];
const rarityScale = [4n,5n,7n,12n,20n];
const offensePrecision = 40n;
function gear(part, rank, rarity = 0, variant = 0) {
  const {stat, names, owner} = parts[part];
  const swift = stat === 'weapon' && variant === 1;
  const multiplier = stat === 'hp' ? 10n : stat === 'weapon' ? (swift ? 2n : 3n) : 1n;
  const baseValue = power(rank) * multiplier * rarityScale[rarity];
  const isOffense = stat === 'weapon' || stat === 'attack';
  const value = isOffense ? baseValue * party[owner].weight : baseValue / 4n;
  return {part, owner, name:(rarity ? rarityNames[rarity] + ' ' : '') + names[variant], label:names[variant], stat, value, swift, rank, rarity};
}
function session(stage = 1) {
  const rank = Math.max(1, stage - 5);
  const armor = gear('전사 상의', rank);
  const equipped = {'전사 무기':gear('전사 무기', rank), '마녀 무기':gear('마녀 무기', rank), '전사 상의':armor};
  return {stage, encounter:1, challengeStage:null, chips:24, essence:0, rank, equipped, pending:[], autoSpin:false, autoBatch:false, autoNextAt:0,
    board:null, winning:[], spinNote:newOfferNote, enemy:enemyAt(stage), hp:armor.value + baseHp, healingMs:0, combatMs:0, attackMs:{warrior:0,witch:0}, phase:'approach', phaseMs:0, blocked:false, spinning:false,
    battleNote:'전사와 마녀가 탑을 오르는 중입니다.'};
}
const newOfferNote = '가운데 가로줄에 2개면 일반. 같은 문양 1줄 희귀 · 2줄 상급 · 3줄 전설 · 4줄 이상 신화.';
let normal = session();
let game = normal;
const el = id => document.getElementById(id);
const reels = [...el('reels').children];
const gearRows = Object.fromEntries(symbols.map(part => {
  const row = document.createElement('div');
  row.className = 'rarity-card';
  const title = document.createElement('strong');
  title.textContent = parts[part].icon + ' ' + part;
  const detail = document.createElement('small');
  const badge = document.createElement('span');
  badge.className = 'rarity-badge';
  badge.hidden = true;
  row.append(title, detail, badge);
  el(parts[part].owner + 'Gear').append(row);
  return [part, {detail, badge}];
}));
const dialog = el('compare');
const total = (stat, owner) => Object.values(game.equipped).reduce((sum, item) => sum + (item.stat === stat && (!owner || item.owner === owner) ? item.value : 0n), 0n);
const maxHp = () => baseHp + total('hp', 'warrior');
const healingRate = () => total('regen', 'witch');
const attackInterval = item => (item.owner === 'witch' ? 1200 : 1000) / (item.swift ? 2 : 1);
const personalBase = owner => baseDamage * party[owner].weight / 10n;
const damageScale = owner => owner === 'witch' ? 12n : 10n;
const roundHit = amount => (amount + 5n * offensePrecision) / (10n * offensePrecision) * 10n;
const damagePerHit = item => roundHit((personalBase(item.owner) * offensePrecision + item.value + total('attack', item.owner)) * damageScale(item.owner));
const formatDamage = amount => format(amount / 10n);
// All supported attack intervals express DPS exactly in sixths.
function formatDps(sixths) {
  const hundredths = (sixths * 100n + 3n) / 6n;
  const decimal = String(hundredths % 100n).padStart(2, '0').replace(/0+$/, '');
  return format(hundredths / 100n) + (decimal ? '.' + decimal : '');
}
const formatStat = stat => stat === 'weapon' ? formatDps : stat === 'attack' ? formatDamage : format;
const spinCost = () => 6;
function upgradeCost(rank) {
  const steps = rank - 1;
  return 4 + 2 * steps + Math.floor(steps * steps / 4);
}
function comparisonValue(item, stat) {
  if (!item) return 0n;
  if (stat === 'weapon') return damagePerHit(item) * 600n / BigInt(attackInterval(item));
  if (stat !== 'attack') return item.value;
  const weapon = game.equipped[party[item.owner].weapon];
  const otherAttack = total('attack', item.owner) - (game.equipped[item.part]?.value ?? 0n);
  const base = (personalBase(item.owner) * offensePrecision + weapon.value + otherAttack) * damageScale(item.owner);
  return roundHit(base + item.value * damageScale(item.owner)) - roundHit(base);
}
function showRarity(badge, item) {
  badge.hidden = !item;
  if (!item) {
    badge.textContent = '';
    delete badge.dataset.rarity;
    delete badge.parentElement.dataset.rarity;
    return;
  }
  badge.dataset.rarity = String(item.rarity);
  badge.parentElement.dataset.rarity = badge.dataset.rarity;
  badge.textContent = rarityNames[item.rarity];
}
function comparisonCard(prefix, item, stat) {
  el(prefix + 'Name').textContent = item?.label || '미장착';
  showRarity(el(prefix + 'Rarity'), item);
  const metric = stat === 'weapon' ? 'DPS' : stat === 'hp' ? '전사 최대 체력' : stat === 'regen' ? '전사 초당 회복' : '한 번 피해';
  const totalValue = comparisonValue(item, stat);
  el(prefix + 'Formula').textContent = item && stat === 'weapon'
    ? formatDamage(damagePerHit(item)) + ' ÷ ' + (attackInterval(item) / 1000) + '초 ' + (totalValue % 3n === 0n ? '=' : '≈') + ' ' + formatDps(totalValue) + ' DPS'
    : '+' + formatStat(stat)(totalValue) + ' ' + metric;
  el(prefix + 'Detail').textContent = item
    ? '등급 ' + item.rank + (stat === 'weapon' ? ' · 한 번 피해는 합산 후 정수로 반올림' : '')
    : '이 부위에 장착된 장비가 없어요.';
}
function salvageValue(item) {
  return item.rarity > 0 ? 3 : 2;
}
function showComparison() {
  const candidate = game.pending[0];
  if (!candidate) return;
  const {part, stat} = candidate;
  const current = game.equipped[part];
  const delta = comparisonValue(candidate, stat) - comparisonValue(current, stat);
  const metric = stat === 'weapon' ? '초당 피해' : stat === 'hp' ? '전사 최대 체력' : stat === 'regen' ? '전사 초당 회복' : '한 번 피해';
  el('compareTitle').textContent = part + ' 비교 · 남은 장비 ' + game.pending.length + '개';
  el('comparison').textContent = delta === 0n ? metric + ' 동일'
    : '새 장비 ' + metric + ' ' + (delta > 0n ? '+' : '−') + formatStat(stat)(delta > 0n ? delta : -delta);
  el('comparison').dataset.result = delta > 0n ? 'up' : delta < 0n ? 'down' : 'equal';
  el('oldCard').classList.toggle('better', delta < 0n);
  el('newCard').classList.toggle('better', delta > 0n);
  comparisonCard('old', current, stat);
  comparisonCard('new', candidate, stat);
  el('salvage').textContent = '분해 · 마력정수 +' + salvageValue(candidate);
  if (!dialog.open) dialog.showModal();
}
function health(bar, label, current, max, display = format) {
  el(bar).style.width = Number(current * 100n / max) + '%';
  el(label).textContent = display(current) + ' / ' + display(max);
}
function render() {
  const {enemy, stage, pending} = game;
  el('chips').textContent = format(game.chips);
  el('essence').textContent = format(game.essence);
  el('stage').textContent = stage + '단계 · ' + (enemy.boss ? '보스' : '몬스터 ' + game.encounter + '/' + monstersPerStage);
  el('enemy').textContent = enemy.rush ? '타락한 탑지기' : enemy.boss ? '철갑 가고일' : '석상 가고일';
  el('foe').dataset.boss = String(enemy.boss);
  el('fightScene').dataset.phase = game.phase;
  for (const [id, member] of Object.entries(party)) {
    el(member.actor).classList.toggle('down', game.blocked);
    const weapon = game.equipped[member.weapon];
    el(id + 'Dps').textContent = member.name + ' ' + formatDps(comparisonValue(weapon, 'weapon')) + ' DPS';
  }
  health('heroBar','heroHp',game.hp,maxHp());
  el('regenRate').textContent = '초당 체력 회복 +' + format(healingRate());
  health('enemyBar','enemyHp',enemy.hp,enemy.maxHp,formatDamage);
  el('battleNote').textContent = game.battleNote;
  el('forge').textContent = '장비 등급 ' + game.rank;
  el('spin').textContent = '슬롯 돌리기 · ' + spinCost() + '칩';
  const cost = upgradeCost(game.rank);
  const gauge = el('essenceGauge');
  gauge.max = cost;
  gauge.value = Math.min(game.essence, cost);
  el('essenceCount').textContent = format(game.essence) + ' / ' + format(cost);
  el('spin').disabled = game.spinning || pending.length > 0 || game.chips < spinCost();
  el('autoSpin').setAttribute('aria-pressed', String(game.autoSpin));
  el('autoSpin').textContent = game.autoSpin ? '자동 정지' : '자동 돌리기';
  el('autoStatus').hidden = !game.autoSpin;
  el('autoStatus').textContent = pending.length ? '장비 결정을 기다리는 중'
    : !game.spinning && game.essence >= cost ? '강화 가능 · 자동 돌리기 일시정지'
    : !game.spinning && game.chips < spinCost() ? '칩이 모이면 자동으로 돌립니다' : '자동 돌리기 켜짐';
  el('upgrade').disabled = game.spinning || game.essence < cost;
  for (const part of symbols) {
    const item = game.equipped[part];
    const {detail, badge} = gearRows[part];
    const label = item?.label || '비어 있음';
    if (detail.textContent !== label) detail.textContent = label;
    if (badge.dataset.rarity !== (item ? String(item.rarity) : undefined)) showRarity(badge, item);
  }
  el('reopen').hidden = pending.length === 0 || game.spinning;
  el('reopen').textContent = '획득 장비 ' + pending.length + '개 비교';
  const training = game.challengeStage !== null;
  el('training').hidden = !training;
  el('trainingNote').textContent = training ? stage + '단계 반복 전투 중' : '';
  el('challenge').textContent = training ? game.challengeStage + '단계 도전' : '도전';
  el('challenge').disabled = game.blocked;
  el('restart').disabled = game.spinning;
  el('benchmark').disabled = game.spinning;
  el('benchmark').textContent = game === normal ? '100단계 시험' : '일반 플레이로 돌아가기';
  el('mode').textContent = game === normal ? '' : '시험 전용 진행 상황';
}
function resetFight() {
  game.enemy = enemyAt(game.stage, game.encounter);
  for (const id of ['warriorHit', 'witchHit']) {
    el(id).classList.remove('show');
    el(id).textContent = '';
  }
  game.combatMs = 0;
  game.attackMs = {warrior:0,witch:0};
  game.phase = 'approach';
  game.phaseMs = 0;
  game.blocked = false;
}
function animate(id, ...classes) {
  const element = el(id);
  element.classList.remove(...classes);
  void element.offsetWidth;
  element.classList.add(...classes);
}
function strike(attacker, defender, amount) {
  animate(attacker, 'attack');
  animate(defender, 'hit');
  el(defender + 'Impact').textContent = '−' + format(amount);
  animate(defender + 'Impact', 'show');
}
function advanceCombat() {
  game.phaseMs += combatStepMs;
  if (game.blocked) {
    if (game.phaseMs < 600) return;
    if (game.challengeStage === null) {
      game.challengeStage = game.stage;
      game.stage = Math.max(1, game.stage - 1);
    }
    enterStage();
    game.battleNote = game.stage + '단계에서 자동으로 반복 전투를 시작합니다.';
    return;
  }
  game.healingMs += combatStepMs;
  if (game.healingMs === 1000) {
    game.healingMs = 0;
    const healed = game.hp + healingRate();
    game.hp = healed < maxHp() ? healed : maxHp();
  }
  if (game.phase === 'victory') {
    if (game.phaseMs < 500) return;
    const totalEncounters = monstersPerStage + (game.stage % bossInterval === 0 ? 1 : 0);
    if (game.encounter === totalEncounters) {
      if (game.challengeStage === null) game.stage++;
      game.encounter = 1;
    } else {
      game.encounter++;
    }
    resetFight();
    game.battleNote = game.enemy.boss
      ? '보스가 반대편에서 접근 중입니다.'
      : '다음 몬스터가 반대편에서 접근 중입니다.';
    return;
  }
  if (game.phase === 'approach') {
    if (game.phaseMs >= 1000) {
      game.phase = 'fight';
      game.battleNote = '몬스터와 마주쳤습니다. 전투 시작!';
    }
    return;
  }
  game.combatMs += combatStepMs;
  const {enemy} = game;
  for (const [id, member] of Object.entries(party)) {
    if (enemy.hp === 0n) break;
    const weapon = game.equipped[member.weapon];
    game.attackMs[id] += combatStepMs;
    if (game.attackMs[id] < attackInterval(weapon)) continue;
    game.attackMs[id] = 0;
    const damage = damagePerHit(weapon);
    if (damage === 0n) continue;
    enemy.hp = enemy.hp > damage ? enemy.hp - damage : 0n;
    animate(member.actor, 'attack');
    animate('enemyActor', 'hit');
    el(id + 'Hit').textContent = member.name + ' −' + formatDamage(damage);
    animate(id + 'Hit', 'show');
  }
  if (enemy.hp === 0n) {
    const reward = (enemy.boss ? 15 : 5) + Math.floor(Math.log2(game.stage));
    game.chips += reward;
    game.battleNote = game.stage + '단계 · ' + (enemy.boss ? '보스 격파' : '몬스터 ' + game.encounter + '/' + monstersPerStage + ' 처치') + ' · +' + reward + '칩';
    game.phase = 'victory';
    game.phaseMs = 0;
    return;
  }
  if (game.combatMs % (enemy.rush ? 500 : 1000) === 0) {
    const damage = enemy.damage < game.hp ? enemy.damage : game.hp;
    strike('enemyActor', 'heroActor', damage);
    game.hp -= damage;
    if (game.hp === 0n) {
      game.phase = 'defeat';
      game.phaseMs = 0;
      game.blocked = true;
      game.battleNote = '전사와 마녀가 쓰러졌습니다. 반복 전투를 준비합니다.';
    }
  }
}
function paintCell(index, symbol) {
  const cell = reels[index];
  cell.textContent = symbol ? parts[symbol].icon : '·';
  if (symbol) {
    const label = document.createElement('small');
    label.textContent = symbol;
    cell.append(label);
  }
  cell.dataset.owner = symbol ? parts[symbol].owner : '';
  cell.setAttribute('aria-label', symbol || '빈 칸');
}
function paintBoard() {
  reels.forEach((cell, index) => {
    paintCell(index, game.board?.[index]);
    const rarity = game.winning[index];
    cell.classList.toggle('win', rarity !== undefined);
    if (rarity === undefined) delete cell.dataset.rarity;
    else cell.dataset.rarity = String(rarity);
  });
}
function slotMessage(message) {
  game.spinNote = message;
  el('spinNote').textContent = message;
}
function resolveSpin(board) {
  const wins = new Map();
  for (const cells of paylines) {
    const part = board[cells[0]];
    if (!cells.every(index => board[index] === part)) continue;
    if (!wins.has(part)) wins.set(part, []);
    wins.get(part).push(cells);
  }
  const pair = symbols.map(part => [3,4,5].filter(index => board[index] === part))
    .find(cells => cells.length === 2);
  const prizes = [...wins].map(([part, lines]) => ({
    part, rarity:Math.min(4, lines.length), cells:lines.flat()
  }));
  if (pair) prizes.push({part:board[pair[0]], rarity:0, cells:pair});
  game.winning = [];
  for (const {cells, rarity} of prizes) {
    cells.forEach(index => {
      game.winning[index] = Math.max(game.winning[index] ?? 0, rarity);
    });
  }
  if (!prizes.length) {
    game.essence++;
    return '장비 문양 불일치 · 마력정수 +1';
  }
  game.pending = prizes.map(({part, rarity}) => {
    const variant = Math.floor(Math.random() * parts[part].names.length);
    return gear(part, game.rank, rarity, variant);
  });
  return rarityNames.map((name, rarity) => {
    const count = prizes.filter(prize => prize.rarity === rarity).length;
    return count ? name + ' 장비 ' + count + '개' : '';
  }).filter(Boolean).reverse().join(' · ') + ' 획득';
}
function randomSymbol() {
  return symbols[Math.floor(Math.random() * symbols.length)];
}
function startSpin(automatic = false) {
  if (game.spinning || game.pending.length > 0 || game.chips < spinCost()) return;
  game.autoBatch = automatic;
  game.chips -= spinCost();
  game.spinning = true;
  game.winning = [];
  game.board = reels.map(randomSymbol);
  slotMessage('슬롯을 돌리는 중…');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  for (let column = 0; column < 3; column++) {
    const indices = [column, column + 3, column + 6];
    const preview = () => indices.forEach(index => paintCell(index, randomSymbol()));
    const timer = reduceMotion ? null : setInterval(preview, 80);
    indices.forEach(index => {
      reels[index].classList.remove('win');
      reels[index].classList.toggle('rolling', !reduceMotion);
    });
    setTimeout(() => {
      if (timer !== null) clearInterval(timer);
      indices.forEach(index => {
        reels[index].classList.remove('rolling');
        paintCell(index, game.board[index]);
      });
      if (column === 2) {
        slotMessage(resolveSpin(game.board));
        paintBoard();
        const finish = () => {
          el('reels').classList.remove('jackpot');
          game.spinning = false;
          game.autoNextAt = performance.now() + 350;
          presentRewards();
        };
        const highestRarity = Math.max(0, ...game.pending.map(item => item.rarity));
        if (game.pending.length && !reduceMotion) {
          const board = el('reels');
          board.dataset.jackpot = rarityNames[highestRarity] + ' 장비 당첨';
          board.dataset.rarity = String(highestRarity);
          animate('reels', 'jackpot');
          setTimeout(finish, 480);
        } else {
          finish();
        }
      }
    }, reduceMotion ? 0 : 330 + column * 160);
  }
  render();
}
function maybeAutoSpin() {
  if (game.autoSpin && game.essence < upgradeCost(game.rank) && !dialog.open && !restartDialog.open && performance.now() >= game.autoNextAt) {
    startSpin(true);
  }
}
function presentRewards() {
  let recovered = 0;
  if (game.autoSpin && game.autoBatch) {
    while (game.pending.length) {
      const candidate = game.pending[0];
      const current = game.equipped[candidate.part];
      if (!current || comparisonValue(candidate, candidate.stat) > comparisonValue(current, candidate.stat)) break;
      recovered += salvageValue(game.pending.shift());
    }
  }
  if (recovered) {
    game.essence += recovered;
    slotMessage('자동 분해 · 마력정수 +' + recovered + (game.pending.length ? ' · 교환할 장비 확인' : ''));
  }
  if (!game.pending.length && dialog.open) dialog.close();
  render();
  showComparison();
}
el('spin').addEventListener('click', () => startSpin());
el('autoSpin').addEventListener('click', () => {
  game.autoSpin = !game.autoSpin;
  render();
  maybeAutoSpin();
});
el('equip').addEventListener('click', () => {
  const item = game.pending.shift();
  if (!item) return;
  const replaced = game.equipped[item.part];
  game.equipped[item.part] = item;
  if (game.hp > maxHp()) game.hp = maxHp();
  if (replaced) game.essence++;
  if (game.pending.length === 0) dialog.close();
  slotMessage(item.name + ' 장착' + (replaced ? ' · 이전 장비 분해로 마력정수 +1' : ''));
  presentRewards();
});
el('salvage').addEventListener('click', () => {
  const item = game.pending.shift();
  if (!item) return;
  const reward = salvageValue(item);
  game.essence += reward;
  if (game.pending.length === 0) dialog.close();
  slotMessage('장비 분해 · 마력정수 +' + reward);
  presentRewards();
});
el('dismiss').addEventListener('click', () => dialog.close());
el('reopen').addEventListener('click', showComparison);
dialog.addEventListener('close', () => {
  (game.pending.length ? el('reopen') : el('spin')).focus();
});
el('upgrade').addEventListener('click', () => {
  const cost = upgradeCost(game.rank);
  if (game.spinning || game.essence < cost) return;
  game.essence -= cost;
  game.rank++;
  animate('reels', 'upgrading');
  slotMessage('슬롯 강화 완료 · 이후 나오는 장비 등급 ' + game.rank);
  render();
});
function enterStage() {
  game.encounter = 1;
  game.hp = maxHp();
  game.healingMs = 0;
  resetFight();
}
el('challenge').addEventListener('click', () => {
  if (game.blocked || game.challengeStage === null) return;
  game.stage = game.challengeStage;
  game.challengeStage = null;
  enterStage();
  game.battleNote = game.stage + '단계에 도전합니다.';
  render();
});
const restartDialog = el('restartDialog');
el('restart').addEventListener('click', () => {
  if (game.spinning) return;

  restartDialog.showModal();
});
el('cancelRestart').addEventListener('click', () => restartDialog.close());
el('confirmRestart').addEventListener('click', () => {
  restartDialog.close();
  normal = session();
  game = normal;
  paintBoard();
  slotMessage(game.spinNote);
  el('witchActor').classList.remove('attack');
  for (const actor of ['heroActor', 'enemyActor']) {
    el(actor).classList.remove('attack', 'hit', 'arrive');
  }
  for (const id of ['heroActorImpact', 'warriorHit', 'witchHit']) {
    el(id).classList.remove('show');
    el(id).textContent = '';
  }
  render();
  el('spin').focus();
});
el('benchmark').addEventListener('click', () => {
  if (game.spinning) return;
  game.autoSpin = false;
  game = game === normal ? session(100) : normal;
  paintBoard();
  slotMessage(game.spinNote);
  render();
  showComparison();
});
render();
setInterval(() => {advanceCombat(); render(); maybeAutoSpin();}, combatStepMs);
</script>
</body>
</html>
